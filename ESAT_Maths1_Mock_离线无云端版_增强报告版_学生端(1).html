<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESAT Maths 1 Mock 离线无云端版·学生端</title>
<style>
:root { --bg:#f4f7fb; --card:#fff; --ink:#172033; --muted:#64748b; --line:#dbe3ef; --accent:#2563eb; --accent2:#1d4ed8; --good:#16a34a; --goodbg:#ecfdf5; --bad:#dc2626; --badbg:#fef2f2; --warn:#f59e0b; --shadow:0 12px 30px rgba(15,23,42,.10); }
* { box-sizing:border-box; }
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif; color:var(--ink); background:linear-gradient(180deg,#eef5ff 0%,var(--bg) 260px); }
.app { max-width:1200px; margin:0 auto; padding:22px; }
.header { display:flex; justify-content:space-between; align-items:flex-start; gap:18px; margin-bottom:18px; }
h1 { margin:0 0 8px; font-size:28px; letter-spacing:-.02em; }
p { line-height:1.55; }
.title p { margin:0; color:var(--muted); }
.card { background:var(--card); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow); }
.timerCard { min-width:300px; padding:16px; }
.timerLine { display:flex; justify-content:space-between; align-items:center; gap:12px; }
.status { color:var(--muted); font-size:14px; }
.timer { font-size:34px; font-weight:850; font-variant-numeric:tabular-nums; color:var(--accent2); }
.timer.danger { color:var(--bad); animation:pulse 1s infinite; }
.scorePill { display:inline-block; margin-top:7px; padding:6px 10px; border-radius:999px; background:#eef2ff; color:#3730a3; font-weight:750; font-size:14px; }
.scorePill.done { background:var(--goodbg); color:#166534; }
.controls { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; align-items:center; }
.controls label { display:flex; align-items:center; gap:6px; color:var(--muted); font-size:14px; }
input[type="number"], input[type="text"] { padding:8px 10px; border:1px solid var(--line); border-radius:10px; font:inherit; }
input[type="number"] { width:76px; }
input[type="text"] { width:150px; max-width:100%; }
.studentFields { display:grid; gap:8px; margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); }
.studentFields label { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:14px; }
.submitHint { margin-top:10px; padding:9px 11px; border-radius:12px; background:#f8fafc; border:1px solid var(--line); color:var(--muted); font-size:14px; line-height:1.45; }
.submitHint.ready { background:#ecfdf5; border-color:#bbf7d0; color:#166534; }
.submitHint.sent { background:#eff6ff; border-color:#bfdbfe; color:#1d4ed8; }
button { font:inherit; }
.btn { border:1px solid var(--line); background:#fff; color:var(--ink); padding:10px 14px; border-radius:12px; cursor:pointer; transition:transform .08s ease, background .15s ease, border-color .15s ease; }
.btn:hover:not(:disabled) { transform:translateY(-1px); border-color:#b8c4d6; background:#f8fafc; }
.btn:disabled { opacity:.45; cursor:not-allowed; }
.btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
.btn.primary:hover:not(:disabled) { background:var(--accent2); }
.btn.danger { color:var(--bad); border-color:#fecaca; }
.btn.ghost { background:transparent; }
.layout { display:grid; grid-template-columns: 1fr 320px; gap:18px; align-items:start; }
.questionCard { padding:18px; }
.questionTop { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; }
.questionNumber { font-size:21px; font-weight:800; }
.selectedAnswer { color:var(--muted); }
.stemWrap { background:white; border:1px solid var(--line); border-radius:16px; padding:16px; text-align:left; overflow:auto; }
.stemImg { display:block; max-width:100%; height:auto; margin:0 auto; border-radius:8px; }
.optionArea { margin-top:16px; padding:14px; background:#f8fafc; border:1px solid var(--line); border-radius:16px; }
.optionTitle { display:flex; justify-content:space-between; gap:8px; color:var(--muted); font-size:14px; margin-bottom:12px; }
.optionList { display:grid; gap:10px; }
.answerBtn { display:flex; align-items:center; gap:12px; min-height:58px; width:100%; border:2px solid var(--line); border-radius:14px; background:#fff; padding:10px 12px; cursor:pointer; text-align:left; transition:all .12s ease; }
.answerBtn:hover:not(:disabled) { border-color:var(--accent); box-shadow:0 8px 20px rgba(37,99,235,.10); transform:translateY(-1px); }
.answerBtn .letter { flex:0 0 auto; width:34px; height:34px; border-radius:999px; display:grid; place-items:center; border:2px solid #cbd5e1; font-weight:850; color:#334155; background:#fff; }
.answerBtn .optImg { display:block; max-width:min(100%, 760px); max-height:160px; height:auto; object-fit:contain; }
.answerBtn.selected { border-color:var(--accent); background:#eff6ff; }
.answerBtn.selected .letter { background:var(--accent); border-color:var(--accent); color:white; }
.answerBtn.correctAnswer { border-color:#22c55e; background:var(--goodbg); }
.answerBtn.correctAnswer .letter { background:#22c55e; border-color:#22c55e; color:white; }
.answerBtn.wrongAnswer { border-color:#ef4444; background:var(--badbg); }
.answerBtn.wrongAnswer .letter { background:#ef4444; border-color:#ef4444; color:white; }
.answerBtn:disabled { cursor:not-allowed; opacity:1; }
.feedbackBox { margin-top:14px; padding:12px 14px; border-radius:14px; border:1px solid var(--line); line-height:1.55; }
.feedbackBox.hidden { display:none; }
.feedbackBox.ok { background:var(--goodbg); border-color:#bbf7d0; color:#14532d; }
.feedbackBox.bad { background:var(--badbg); border-color:#fecaca; color:#7f1d1d; }
.navButtons { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
.side { padding:16px; position:sticky; top:16px; }
.progressText { color:var(--muted); margin-bottom:8px; }
.progressTrack { height:10px; background:#e8eef6; border-radius:999px; overflow:hidden; margin-bottom:16px; }
.progressBar { height:100%; width:0%; background:var(--accent); border-radius:999px; transition:width .2s ease; }
.questionGrid { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-bottom:16px; }
.qnav { height:42px; border:1px solid var(--line); background:white; border-radius:12px; cursor:pointer; font-weight:750; position:relative; }
.qnav:hover { border-color:var(--accent); }
.qnav.current { outline:3px solid rgba(37,99,235,.2); border-color:var(--accent); color:var(--accent); }
.qnav.answered { background:#ecfdf5; border-color:#bbf7d0; color:#166534; }
.qnav.correct { background:#dcfce7; border-color:#22c55e; color:#166534; }
.qnav.wrong { background:#fee2e2; border-color:#ef4444; color:#991b1b; }
.qnav.unanswered { background:#f1f5f9; border-color:#cbd5e1; color:#475569; }
.qnav.marked::after { content:'★'; position:absolute; right:4px; top:2px; color:var(--warn); font-size:12px; }
.legend { display:grid; gap:8px; color:var(--muted); font-size:13px; margin-bottom:16px; }
.legend span { display:flex; align-items:center; gap:8px; }
.dot { width:14px; height:14px; border-radius:4px; border:1px solid var(--line); display:inline-block; background:white; }
.dot.answered { background:#ecfdf5; border-color:#bbf7d0; }
.dot.current { border-color:var(--accent); box-shadow:0 0 0 3px rgba(37,99,235,.18); }
.dot.correct { background:#dcfce7; border-color:#22c55e; }
.dot.wrong { background:#fee2e2; border-color:#ef4444; }
.dot.marked { background:#fff7ed; border-color:#fed7aa; }
.sideActions { display:grid; gap:10px; }
.modal { display:none; position:fixed; inset:0; z-index:50; background:rgba(15,23,42,.46); align-items:center; justify-content:center; padding:18px; }
.modal.show { display:flex; }
.modalCard { background:white; width:min(1080px, 100%); max-height:86vh; overflow:auto; border-radius:18px; box-shadow:0 24px 80px rgba(15,23,42,.28); }
.modalHead { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:16px 18px; border-bottom:1px solid var(--line); position:sticky; top:0; background:white; z-index:2; }
.modalHead h2 { margin:0; font-size:20px; }
.modalBody { padding:18px; }
.resultStats { margin-bottom:14px; color:var(--muted); line-height:1.6; }
.tableWrap { overflow:auto; }
table { border-collapse:collapse; width:100%; min-width:760px; }
th,td { border:1px solid var(--line); padding:8px 10px; text-align:left; vertical-align:top; }
th { background:#f8fafc; white-space:nowrap; }
tr.rowOk td { background:#f0fdf4; }
tr.rowBad td { background:#fff1f2; }
tr.rowMiss td { background:#f8fafc; }
.allReview { display:grid; gap:16px; }
.reviewCard { border:1px solid var(--line); border-radius:16px; padding:14px; background:#fff; }
.reviewHead { display:flex; justify-content:space-between; gap:10px; align-items:center; margin-bottom:10px; }
.reviewHead button { font-weight:800; }
.reviewStem { border:1px solid var(--line); border-radius:12px; padding:10px; overflow:auto; background:#fff; }
.reviewStem img { max-width:100%; height:auto; display:block; margin:0 auto; }
.reviewOptions { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:8px; margin-top:10px; }
.reviewOptions .answerBtn { min-height:48px; padding:8px; }
.reviewOptions .answerBtn .letter { width:28px; height:28px; font-size:14px; }
.reviewOptions .answerBtn .optImg { max-height:92px; }
.reviewMeta { color:var(--muted); font-size:13px; }
.toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); opacity:0; pointer-events:none; background:#111827; color:#fff; border-radius:999px; padding:10px 16px; transition:all .18s ease; z-index:60; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
@keyframes pulse { 50% { opacity:.55; } }
@media (max-width:900px) { .header { flex-direction:column; } .timerCard { width:100%; } .layout { grid-template-columns:1fr; } .side { position:static; } .questionGrid { grid-template-columns:repeat(9,1fr); } }
@media (max-width:560px) { .app { padding:14px; } h1 { font-size:22px; } .timer { font-size:30px; } .questionGrid { grid-template-columns:repeat(6,1fr); } .optionTitle { flex-direction:column; } .answerBtn .optImg { max-height:130px; } .reviewOptions { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="title">
      <h1>ESAT Maths 1 Mock 离线无云端版·学生端</h1>
      <p>一题一页、按钮作答、可回看全部题目。必须答完 27 题后才会出现“提交并批改”按钮；本版本不使用云端或服务器，提交后请导出 JSON 成绩文件交给老师导入教师端。</p>
    </div>
    <section class="card timerCard" aria-label="计时器">
      <div class="timerLine"><div><div class="status" id="statusText">未开始</div><div class="timer" id="timer">40:00</div><div class="scorePill" id="scorePill">未批改</div></div><button class="btn primary" id="startBtn" type="button">开始计时</button></div>
      <div class="controls"><label>限时 <input id="minutesInput" type="number" min="1" max="240" step="1" value="40"> 分钟</label><button class="btn danger" id="resetBtn" type="button">重置</button></div><div class="studentFields"><label>姓名/编号 <input id="studentName" type="text" placeholder="必填"></label><label>班级/备注 <input id="studentGroup" type="text" placeholder="可选"></label><div class="submitHint" id="submitHint">答完 27 题后才会出现提交按钮。</div></div>
    </section>
  </header>
  <main class="layout">
    <section class="card questionCard">
      <div class="questionTop"><div class="questionNumber" id="questionNumber">第 1 题</div><div class="selectedAnswer" id="selectedAnswer">当前未作答</div></div>
      <div class="stemWrap"><img class="stemImg" id="stemImage" alt="题干图片"></div>
      <div class="optionArea">
        <div class="optionTitle"><span>点击选项按钮作答，选择后会自动跳到下一题。</span><span>快捷键：A-H / ← →</span></div>
        <div class="optionList" id="options"></div>
      </div>
      <div class="feedbackBox hidden" id="feedbackBox"></div>
      <div class="navButtons">
        <button class="btn" id="prevBtn" type="button">上一题</button>
        <button class="btn" id="nextBtn" type="button">下一题</button>
        <button class="btn" id="clearBtn" type="button">清除本题选择</button>
        <button class="btn" id="markBtn" type="button">标记此题</button>
        <button class="btn primary" id="submitBtn" type="button" style="display:none">提交并批改</button>
      </div>
    </section>
    <aside class="card side">
      <div class="progressText" id="progressText">已答 0 / 27</div>
      <div class="progressTrack"><div class="progressBar" id="progressBar"></div></div>
      <div class="questionGrid" id="questionGrid" aria-label="题号导航"></div>
      <div class="legend"><span><i class="dot current"></i>当前题</span><span><i class="dot answered"></i>已作答</span><span><i class="dot correct"></i>批改后正确</span><span><i class="dot wrong"></i>批改后错误</span><span><i class="dot marked"></i>星号为标记题</span></div>
      <div class="sideActions">
        <button class="btn" id="reviewAllBtn" type="button">回看全部题目</button>
        <button class="btn" id="resultsBtn" type="button">查看批改结果</button>
        <button class="btn" id="exportCsvBtn" type="button">导出 CSV</button>
        <button class="btn" id="exportJsonBtn" type="button">导出 JSON</button>
      </div>
    </aside>
  </main>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modalCard">
    <div class="modalHead"><h2 id="modalTitle">结果</h2><button class="btn ghost" id="closeModal" type="button">关闭</button></div>
    <div class="modalBody" id="modalBody"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

const EXPLANATIONS = ["指数相加并处理负指数，结果为 1/(5x^3)。", "0.9×1.1=0.99，1.1×0.9=0.99，两者都低于原价。", "先因式分解，再把除法改为乘倒数并约分。", "整理为 3/4 - 5x/4 < 0，所以 x > 3/5。", "ST=8、QT=4 得 SQ=4√3；RQ=3√3，再由 PR=8 得 PQ=√37。", "T10=49=2(15+p)，所以 p=9.5，V4=21.5。", "两个圆柱侧面积相同，底面积部分相差 π/2(x²-y²)。", "设共同花费为 s，(45-s):(18-s)=3:1，得 s=£4.50。", "半径斜率为 3/4，切线斜率为 -4/3，代入点 (4,3) 得 3y+4x=25。", "36 种等可能结果中，总分大于 9 的有 5 种。", "两式相加得 8^x=1/4=2^-2，所以 x=-2/3。", "设 y³=t，整理可得 t=(x-4)/(2x-12)。", "圆柱总表面积等于 4 倍立方体总表面积，得 h=(108/π-1)r。", "均值=(20+3x)/6，中位数=x+1/2，均值比中位数大 1，得 x=3 2/3。", "上坡路程 8 km，全程 16 km；总时间 64 分钟，下降用时 24 分钟，速度 20 km h^-1。", "y=√3-2，展开 (√3-2)^3 得 15√3-26。", "t=k/w²，代入求 k 后令 t=100，得 w=1.2×10^-2。", "由 tan∠RSQ=5/8 和 RS=40 得 QR=25；再由 30° 得水平距离 40√3，所以 PS=25+40√3。", "根差为 √D/|a|，即 √(16-8c)/2=√10，解得 c=-3。", "大矩形面积 (2x+2)(x+4)=360，得 x=11，PQ:PS=12:21=4:7。", "相似三角形给 x/(2x+1)=3/(x+5)，求出 QR=2+√13。", "两颗都不是绿糖即两颗红糖，C(R,2)/C(9,2)=5/12 得 R=6、G=3，所以两颗绿糖概率为 1/12。", "两次平移总向量为 (4,-3)，联立 3p+q=4、-4p-2q=-3，得 p+q=-1。", "二次函数最小值为 a-a²，要在 x 轴上方需 a(1-a)>0，即 0<a<1。", "总组合 C(10,2)=45；容量和为 10 的有 2+8 两种和 3+7 十二种，共 14 种。", "小长方体空间对角线是原来的一半，sqrt(13+x²)=sqrt(77)/2，得 x=5/2。", "Alex 完赛时间为 400/(1.12c)，Sam 跑了 400×0.98/1.12=350m，距终点 50m。"];
const STORE_KEY = 'esat_maths1_mock_offline_no_cloud_student_v1';
const DEFAULT_MINUTES = 40;
let state = null;
let tickTimer = null;
let toastTimer = null;
const $ = (id) => document.getElementById(id);

function makeInitialState() {
  return { current:0, answers:Array(QUESTIONS.length).fill(null), marked:Array(QUESTIONS.length).fill(false), durationSeconds:DEFAULT_MINUTES*60, started:false, endTime:null, submitted:false, submittedAt:null, studentName:'', studentGroup:'', uploaded:false, uploadMessage:'' };
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return makeInitialState();
    const merged = Object.assign(makeInitialState(), JSON.parse(raw));
    if (!Array.isArray(merged.answers) || merged.answers.length !== QUESTIONS.length) merged.answers = Array(QUESTIONS.length).fill(null);
    if (!Array.isArray(merged.marked) || merged.marked.length !== QUESTIONS.length) merged.marked = Array(QUESTIONS.length).fill(false);
    return merged;
  } catch(e) { return makeInitialState(); }
}
function saveState() { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
function fmt(seconds) { seconds=Math.max(0, Math.floor(seconds)); const m=String(Math.floor(seconds/60)).padStart(2,'0'); const s=String(seconds%60).padStart(2,'0'); return `${m}:${s}`; }
function remainingSeconds() { if (!state.started || !state.endTime) return state.durationSeconds; return Math.max(0, Math.ceil((state.endTime - Date.now())/1000)); }
function answeredCount() { return state.answers.filter(Boolean).length; }
function correctCount() { return state.answers.filter((ans,i)=>ans===ANSWER_KEY[i]).length; }
function wrongCount() { return state.answers.filter((ans,i)=>ans && ans!==ANSWER_KEY[i]).length; }
function statusFor(i) { if (!state.answers[i]) return '未答'; if (!state.submitted) return '已答'; return state.answers[i]===ANSWER_KEY[i] ? '正确' : '错误'; }
function toast(msg) { clearTimeout(toastTimer); $('toast').textContent=msg; $('toast').classList.add('show'); toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1600); }
function updateTimer() {
  const left = remainingSeconds();
  $('timer').textContent = fmt(left);
  $('timer').classList.toggle('danger', left <= 300 && state.started && !state.submitted);
  if (state.submitted) $('statusText').textContent = '已提交';
  else if (state.started && left > 0) $('statusText').textContent = '计时中';
  else if (state.started && left <= 0) $('statusText').textContent = '时间到';
  else $('statusText').textContent = '未开始';
  if (state.started && left <= 0 && !state.submitted) { state.submitted = true; state.submittedAt = new Date().toISOString(); saveState(); toast('时间到，已自动提交批改'); render(); }
}
function renderScorePill() {
  const pill = $('scorePill');
  if (state.submitted) { pill.textContent = `得分 ${correctCount()} / ${QUESTIONS.length}`; pill.classList.add('done'); }
  else { pill.textContent = `已答 ${answeredCount()} / ${QUESTIONS.length}`; pill.classList.remove('done'); }
}
function renderGrid() {
  const grid = $('questionGrid'); grid.innerHTML='';
  QUESTIONS.forEach((q,i)=>{
    const b=document.createElement('button'); b.type='button'; b.className='qnav'; b.textContent=i+1; b.title=`第 ${i+1} 题：${statusFor(i)}${state.marked[i]?'，已标记':''}`;
    if (i===state.current) b.classList.add('current');
    if (state.answers[i]) b.classList.add('answered');
    if (state.marked[i]) b.classList.add('marked');
    if (state.submitted) { if (state.answers[i]) b.classList.add(state.answers[i]===ANSWER_KEY[i]?'correct':'wrong'); else b.classList.add('unanswered'); }
    b.addEventListener('click',()=>goTo(i)); grid.appendChild(b);
  });
}
function makeOptionButton(qIndex, opt, compact=false) {
  const b=document.createElement('button'); b.type='button'; b.className='answerBtn';
  if (state.answers[qIndex] === opt.label) b.classList.add('selected');
  if (state.submitted && opt.label === ANSWER_KEY[qIndex]) b.classList.add('correctAnswer');
  if (state.submitted && state.answers[qIndex] === opt.label && opt.label !== ANSWER_KEY[qIndex]) b.classList.add('wrongAnswer');
  b.disabled = state.submitted;
  b.innerHTML = `<span class="letter">${opt.label}</span><img class="optImg" alt="选项 ${opt.label}" src="${opt.image}">`;
  b.addEventListener('click',()=>selectAnswer(qIndex,opt.label,compact));
  return b;
}
function renderOptions() {
  const list=$('options'); list.innerHTML='';
  QUESTIONS[state.current].options.forEach(opt => list.appendChild(makeOptionButton(state.current,opt)));
}
function renderFeedback() {
  const box=$('feedbackBox');
  if (!state.submitted) { box.className='feedbackBox hidden'; box.innerHTML=''; return; }
  const i=state.current, your=state.answers[i]||'未答', ok=state.answers[i]===ANSWER_KEY[i];
  box.className='feedbackBox ' + (ok ? 'ok' : 'bad');
  box.innerHTML = `<strong>${ok ? '本题正确' : '本题需要订正'}</strong><span>你的答案：${your} ｜ 正确答案：${ANSWER_KEY[i]}</span><p>${EXPLANATIONS[i] || ''}</p>`;
}
function renderQuestion() {
  const q=QUESTIONS[state.current];
  $('questionNumber').textContent = `第 ${state.current+1} 题 / 共 ${QUESTIONS.length} 题`;
  $('selectedAnswer').textContent = state.answers[state.current] ? `当前选择：${state.answers[state.current]}` : '当前未作答';
  $('stemImage').src = q.stemImage;
  renderOptions(); renderFeedback();
  $('prevBtn').disabled = state.current===0;
  $('nextBtn').disabled = state.current===QUESTIONS.length-1;
  $('clearBtn').disabled = state.submitted || !state.answers[state.current];
  $('markBtn').textContent = state.marked[state.current] ? '取消标记' : '标记此题';
}
function renderSubmitArea() {
  const answered=answeredCount();
  const complete=answered===QUESTIONS.length;
  const btn=$('submitBtn');
  const hint=$('submitHint');
  if (!btn || !hint) return;
  btn.style.display = (!state.submitted && complete) ? '' : 'none';
  hint.className = 'submitHint' + (state.submitted ? ' sent' : complete ? ' ready' : '');
  if (state.submitted) {
    hint.textContent = state.uploadMessage || `已提交批改，得分 ${correctCount()} / ${QUESTIONS.length}。`;
  } else if (complete) {
    hint.textContent = '27 题已全部作答，可以提交并批改。提交后不能修改答案。';
  } else {
    hint.textContent = `还差 ${QUESTIONS.length-answered} 题未答；答完 27 题后才会出现提交按钮。`;
  }
}
function renderProgress() {
  const answered=answeredCount();
  $('progressText').textContent = state.submitted ? `得分 ${correctCount()} / ${QUESTIONS.length}，错误 ${wrongCount()}，未答 ${QUESTIONS.length - answered}` : `已答 ${answered} / ${QUESTIONS.length}`;
  $('progressBar').style.width = `${answered/QUESTIONS.length*100}%`;
}
function render() { updateTimer(); renderScorePill(); renderQuestion(); renderGrid(); renderProgress(); renderSubmitArea(); saveState(); }
function goTo(i) { state.current=Math.min(Math.max(0,i), QUESTIONS.length-1); render(); window.scrollTo({top:0,behavior:'smooth'}); }
function selectAnswer(qIndex, label, fromReview=false) {
  if (state.submitted) return;
  state.answers[qIndex]=label; saveState();
  if (fromReview) { render(); showAllQuestions(); return; }
  if (qIndex === state.current) {
    render();
    if (state.current < QUESTIONS.length-1) setTimeout(()=>{ if (!state.submitted && state.answers[state.current]===label) goTo(state.current+1); }, 180);
  } else { render(); }
}
function clearCurrent() { if (!state.submitted) { state.answers[state.current]=null; render(); } }
function toggleMark() { state.marked[state.current] = !state.marked[state.current]; render(); }
function buildSubmission() {
  return {
    exam:'ESAT Maths 1 Mock',
    studentName:(state.studentName||'').trim(),
    studentGroup:(state.studentGroup||'').trim(),
    submittedAt:state.submittedAt,
    score:correctCount(),
    total:QUESTIONS.length,
    percentage:Math.round(correctCount()/QUESTIONS.length*10000)/100,
    durationSeconds:state.durationSeconds,
    answers:rowsData(),
    userAgent:navigator.userAgent
  };
}
function uploadResultToServer() {
  state.uploaded=false;
  state.uploadMessage = '已完成本机批改。请点击“导出 JSON”生成成绩文件，并交给老师导入教师端。';
  saveState(); render();
}
function submitQuiz() {
  const missing=QUESTIONS.length-answeredCount();
  if (missing) { toast(`还差 ${missing} 题，答完 27 题后才能提交`); return; }
  state.studentName = ($('studentName') && $('studentName').value || state.studentName || '').trim();
  state.studentGroup = ($('studentGroup') && $('studentGroup').value || state.studentGroup || '').trim();
  if (!state.studentName) { alert('请先填写姓名/编号，方便教师端区分每个人的成绩。'); $('studentName').focus(); return; }
  if (!confirm('确认提交并批改吗？提交后不能继续修改答案。')) return;
  state.submitted=true; state.submittedAt=new Date().toISOString(); state.uploadMessage='已完成本机批改。请导出 JSON 成绩文件交给老师。'; saveState(); render(); uploadResultToServer(); showResults();
}
function startTimer() {
  if (state.submitted) return;
  const minutes=Math.max(1, Math.min(240, Number($('minutesInput').value)||DEFAULT_MINUTES));
  state.durationSeconds=minutes*60; state.started=true; state.endTime=Date.now()+state.durationSeconds*1000; $('minutesInput').disabled=true; saveState(); render();
  if (!tickTimer) tickTimer=setInterval(updateTimer, 250);
}
function resetQuiz() {
  if (!confirm('确认清空全部作答、计时和批改结果吗？')) return;
  state=makeInitialState(); $('minutesInput').disabled=false; $('minutesInput').value=DEFAULT_MINUTES; saveState(); render(); closeModal();
}
function csvEscape(v) { return `"${String(v ?? '').replace(/"/g,'""')}"`; }
function rowsData() {
  return QUESTIONS.map((q,i)=>({question:i+1, yourAnswer:state.answers[i]||'', correctAnswer:ANSWER_KEY[i], result:state.answers[i] ? (state.answers[i]===ANSWER_KEY[i]?'correct':'wrong') : 'unanswered', marked:state.marked[i]?'yes':'no'}));
}
function downloadText(filename, text, type='text/plain;charset=utf-8') {
  const blob=new Blob([text],{type}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function exportCsv() {
  const header=['Student','Group','Question','Your Answer','Correct Answer','Result','Marked'];
  const lines=[header.map(csvEscape).join(',')].concat(rowsData().map(r=>[state.studentName||'',state.studentGroup||'',r.question,r.yourAnswer,r.correctAnswer,r.result,r.marked].map(csvEscape).join(',')));
  downloadText('ESAT_Maths_1_Mock_学生成绩.csv', '﻿'+lines.join('\n'), 'text/csv;charset=utf-8');
}
function exportJson() { downloadText('ESAT_Maths_1_Mock_学生成绩_请交老师.json', JSON.stringify(buildSubmission(), null, 2), 'application/json;charset=utf-8'); }
function showModal(title, bodyHtml) { $('modalTitle').textContent=title; $('modalBody').innerHTML=bodyHtml; $('modal').classList.add('show'); }
function closeModal() { $('modal').classList.remove('show'); }
function resultText(i) { if (!state.answers[i]) return '未答'; if (!state.submitted) return '已答'; return state.answers[i]===ANSWER_KEY[i] ? '正确' : '错误'; }
function showResults() {
  const rows=rowsData();
  const body = `<div class="resultStats">${state.submitted ? `得分 <strong>${correctCount()} / ${QUESTIONS.length}</strong>；` : '尚未提交批改；'}已答 ${answeredCount()} 题，未答 ${QUESTIONS.length-answeredCount()} 题。</div>` +
    `<div class="tableWrap"><table><thead><tr><th>题号</th><th>你的答案</th><th>正确答案</th><th>结果</th></tr></thead><tbody>` +
    rows.map(r=>`<tr class="${r.result==='correct'?'rowOk':r.result==='wrong'?'rowBad':'rowMiss'}"><td>Q${r.question}</td><td>${r.yourAnswer||'未答'}</td><td>${r.correctAnswer}</td><td>${r.result==='correct'?'正确':r.result==='wrong'?'错误':'未答'}</td></tr>`).join('') + `</tbody></table></div>`;
  showModal('批改结果与答案', body);
}
function showAllQuestions() {
  let body = `<div class="resultStats">这里可以一次回看全部题目。未提交前可直接在这里改答案；点击题号可跳回单题页面。</div><div class="allReview">`;
  QUESTIONS.forEach((q,i)=>{
    const meta = state.submitted ? `你的答案：${state.answers[i]||'未答'} ｜ 正确答案：${ANSWER_KEY[i]} ｜ ${resultText(i)}` : `当前：${state.answers[i]||'未答'}${state.marked[i]?' ｜ 已标记':''}`;
    body += `<section class="reviewCard"><div class="reviewHead"><button class="btn ghost" type="button" data-jump="${i}">Q${i+1}</button><span class="reviewMeta">${meta}</span></div><div class="reviewStem"><img alt="Q${i+1} 题干" src="${q.stemImage}"></div><div class="reviewOptions" data-q="${i}"></div></section>`;
  });
  body += `</div>`;
  showModal('回看全部题目', body);
  document.querySelectorAll('[data-jump]').forEach(el=>el.addEventListener('click',()=>{ const i=Number(el.getAttribute('data-jump')); closeModal(); goTo(i); }));
  document.querySelectorAll('.reviewOptions').forEach(container=>{
    const i=Number(container.getAttribute('data-q'));
    QUESTIONS[i].options.forEach(opt=>container.appendChild(makeOptionButton(i,opt,true)));
  });
}
function attachEvents() {
  $('startBtn').addEventListener('click', startTimer);
  $('resetBtn').addEventListener('click', resetQuiz);
  $('prevBtn').addEventListener('click',()=>goTo(state.current-1));
  $('nextBtn').addEventListener('click',()=>goTo(state.current+1));
  $('clearBtn').addEventListener('click', clearCurrent);
  $('markBtn').addEventListener('click', toggleMark);
  $('submitBtn').addEventListener('click', submitQuiz);
  $('resultsBtn').addEventListener('click', showResults);
  $('reviewAllBtn').addEventListener('click', showAllQuestions);
  $('exportCsvBtn').addEventListener('click', exportCsv);
  $('exportJsonBtn').addEventListener('click', exportJson);
  $('closeModal').addEventListener('click', closeModal);
  $('modal').addEventListener('click', e=>{ if (e.target.id==='modal') closeModal(); });
  $('minutesInput').addEventListener('change',()=>{ if (!state.started) { const minutes=Math.max(1, Math.min(240, Number($('minutesInput').value)||DEFAULT_MINUTES)); state.durationSeconds=minutes*60; saveState(); render(); } });
  $('studentName').addEventListener('input',()=>{ state.studentName=$('studentName').value; saveState(); });
  $('studentGroup').addEventListener('input',()=>{ state.studentGroup=$('studentGroup').value; saveState(); });
  document.addEventListener('keydown', e=>{
    if (e.target && ['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;
    if (e.key==='ArrowLeft') goTo(state.current-1);
    if (e.key==='ArrowRight') goTo(state.current+1);
    const key=e.key.toUpperCase();
    if (/^[A-H]$/.test(key)) { const labels=QUESTIONS[state.current].options.map(o=>o.label); if (labels.includes(key)) selectAnswer(state.current,key); }
    if (e.key==='Escape') closeModal();
  });
}
function init() {
  state=loadState();
  $('minutesInput').value = Math.round((state.durationSeconds || DEFAULT_MINUTES*60)/60);
  $('studentName').value = state.studentName || '';
  $('studentGroup').value = state.studentGroup || '';
  if (state.started) $('minutesInput').disabled = true;
  attachEvents(); render();
  if (!tickTimer) tickTimer=setInterval(updateTimer,250);
}
init();
</script>
